name: CI - Testes Automatizados e Cobertura
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de teste
        run: pip install pytest pytest-cov
      - name: Executar testes unitarios e de integracao com cobertura
        run: PYTHONPATH=tests pytest --cov=tests --cov-report=term-missing
